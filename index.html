<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>角色名單</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;family=Noto+Serif+TC:wght@400;500;700;900&amp;family=LXGW+WenKai+TC:wght@400;700&amp;family=Oswald:wght@500;700&amp;family=Special+Elite&amp;display=swap" rel="stylesheet">
<style id="css">/* 版面：一張木頭書桌。列表是一排牛皮紙資料夾，角色頁是攤開的機密檔案；其他頁面是一張紙 */
:root{
  --desk:#34251b; --desk-ink:#f1e6d0; --desk-muted:#c9b79b;
  --surface:#f4eddd; --paper2:#ebe1cb; --manila:#dcbf86; --manila-d:#c6a263;
  --ink:#221c17; --muted:#6c604f; --line:#cbbd9f; --black:#1f1b18;
  --accent:#a8281d; --plan:#2e4d86; --trpg:#2b6a52; --none:#6b6257;
  --display:"Oswald","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --type:"Special Elite","Noto Serif TC","Courier New",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --shadow:0 2px 3px rgba(0,0,0,.25),0 10px 24px rgba(0,0,0,.28);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65;min-height:100vh;
  background-color:var(--desk);
  background-image:repeating-linear-gradient(91deg,rgba(255,255,255,.028) 0 2px,transparent 2px 11px),
    repeating-linear-gradient(89deg,rgba(0,0,0,.09) 0 1px,transparent 1px 37px),
    linear-gradient(180deg,#463022 0%,#2c1f16 100%);background-attachment:fixed}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.25}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.spacer{flex:1}
.muted{color:var(--muted)}

/* 頂部 */
header.top{position:sticky;top:0;z-index:20;background:#1a1411;color:var(--desk-ink);border-bottom:3px solid var(--black);box-shadow:0 2px 10px rgba(0,0,0,.4)}
header.top .wrap{display:flex;align-items:center;gap:18px;min-height:60px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.brand{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.06em;display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--desk-ink)}
.seal{width:30px;height:30px;border:2px solid #d0543f;color:#d0543f;border-radius:4px;display:grid;place-items:center;font-size:14px;font-weight:900;transform:rotate(-5deg)}
nav.main{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
nav.main a{text-decoration:none;color:var(--desk-muted);padding:6px 14px;border-radius:4px;font-family:"Oswald",var(--display);font-weight:500;font-size:17px;letter-spacing:.12em;text-transform:uppercase}
nav.main a.navicon{padding:4px 8px;margin-right:6px;display:flex}
.sunflower{width:34px;height:34px;display:block;transition:transform .4s}
nav.main a.navicon:hover .sunflower,nav.main a.navicon.on .sunflower{transform:rotate(22deg)}
nav.main a.navicon.on{background:rgba(255,255,255,.1)}
nav.main a.on{color:#fff;background:rgba(255,255,255,.1)}
nav.main a:hover{color:#fff}
.status{font-size:12px;color:var(--desk-muted)}
.status.warn{color:#f08a74}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:4px;cursor:pointer;font-weight:500;line-height:1.4}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--black);color:var(--surface);border-color:var(--black)}
header .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--accent);border-color:var(--accent)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
main{padding:28px 0 40px}
.ro .needs-write{display:none!important}
.editor-only{display:none!important}
.can-edit .editor-only{display:inline-flex!important}
.can-edit .guestbar.editor-only{display:block!important}
.guestbar{background:var(--accent);color:#fff;font-size:14px}
.guestbar .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.foot{color:var(--desk-muted);font-size:13px;padding:10px 0 30px;font-family:var(--type);font-variant-numeric:tabular-nums}

/* 書桌上的篩選列 */
.cats{display:flex;align-items:center;border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:16px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{border:0;background:none;padding:10px 18px;cursor:pointer;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.04em;color:var(--desk-muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.cats button.on{color:#fff;border-bottom-color:var(--manila)}
.cats .n{font-family:var(--type);font-size:12px;font-weight:400;margin-left:6px;opacity:.8}
.filters{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:30px}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.18);border-radius:4px;overflow:hidden;background:rgba(0,0,0,.25)}
.seg button{border:0;background:none;padding:6px 13px;cursor:pointer;color:var(--desk-muted);font-size:14px}
.seg button+button{border-left:1px solid rgba(255,255,255,.14)}
.seg button.on{background:var(--manila);color:var(--ink);font-weight:700}
.flabel{font-size:12px;color:var(--desk-muted);margin-right:6px}
.search{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:6px 12px;min-width:190px}
.group-h{display:flex;align-items:baseline;gap:12px;margin:30px 0 14px;color:var(--desk-ink)}
.group-h h2{font-size:24px;letter-spacing:.04em}
.group-h span{color:var(--desk-muted);font-size:13px;font-family:var(--type)}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:6px}
main > .wrap > .empty, .grid + .empty{color:var(--desk-muted);border-color:rgba(255,255,255,.2)}

/* 資料夾卡片 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:34px 24px}
.folder{position:relative;border:0;background:none;padding:22px 0 0;cursor:pointer;text-align:left;display:block;transition:transform .18s}
.folder::before{content:"";position:absolute;left:0;right:0;top:22px;bottom:0;background:var(--manila-d);border-radius:0 6px 6px 6px;box-shadow:var(--shadow)}
.ftab{position:absolute;top:0;left:0;height:26px;max-width:80%;display:flex;align-items:center;gap:7px;padding:0 14px;background:var(--manila-d);border-radius:7px 7px 0 0;font-family:var(--type);font-size:12px;color:#4a3b25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftab i{width:9px;height:9px;border-radius:50%;background:var(--cc);flex:none;box-shadow:0 0 0 1.5px rgba(0,0,0,.2)}
.fpaper{position:absolute;z-index:1;top:30px;left:14px;right:22px;height:60px;background:var(--surface);transform:rotate(-1.6deg);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s;
  background-image:repeating-linear-gradient(180deg,transparent 0 13px,rgba(80,100,140,.18) 13px 14px)}
.folder:hover{transform:translateY(-3px)}
.folder:hover .fpaper{transform:translateY(-12px) rotate(-2.6deg)}
.fbody{position:relative;z-index:2;margin-top:18px;display:flex;flex-direction:column;gap:10px;padding:18px 14px 14px;background:linear-gradient(170deg,#e3c891,var(--manila) 60%);border-radius:3px 3px 6px 6px;box-shadow:0 -1px 0 rgba(0,0,0,.08) inset}
.fphoto{position:relative;align-self:center;width:82%;background:#fbf8f1;padding:7px 7px 18px;box-shadow:0 2px 6px rgba(0,0,0,.25);transform:rotate(-2deg)}
.folder:nth-child(even) .fphoto{transform:rotate(1.6deg)}
.fphoto img{width:100%;aspect-ratio:4/5;object-fit:cover;background:var(--paper2)}
.clip{position:absolute;top:-16px;right:16px;width:16px;height:46px;stroke:#8f959c;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.fname{display:block;background:var(--surface);border-left:6px solid var(--cc);padding:6px 10px;font-family:var(--display);font-weight:700;font-size:18px;line-height:1.3;letter-spacing:.03em;box-shadow:0 1px 1px rgba(0,0,0,.15)}
.fname small{display:block;font-family:var(--type);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0}
.fmeta{display:flex;justify-content:space-between;font-family:var(--type);font-size:13px;color:#4a3b25;border-top:1px dashed rgba(74,59,37,.4);padding-top:6px;font-variant-numeric:tabular-nums}
.fproj{font-size:12px;color:#4a3b25}
.fstamp{position:absolute;z-index:3;top:12px;left:12px;font-family:var(--type);font-size:12px;color:var(--accent);border:2px solid var(--accent);border-radius:3px;padding:0 6px;transform:rotate(-8deg);opacity:.85}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:0 8px;border-radius:3px;border:1.5px solid currentColor;line-height:1.7;white-space:nowrap}
.pill.p-企劃{color:var(--plan)} .pill.p-TRPG{color:var(--trpg)} .pill.p-無{color:var(--none)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;background:var(--paper2);padding:1px 8px;border-radius:2px;color:var(--muted);font-family:var(--type)}

/* 角色檔案 */
.dtoolbar{display:flex;align-items:center;gap:10px;max-width:900px;margin:0 auto 18px}
.back{color:var(--desk-muted);text-decoration:none;font-size:14px}
.back:hover{color:#fff}
.dstage{position:relative;max-width:900px;margin:0 auto;padding:18px 0 10px}
.dfolder{position:absolute;inset:0 -14px -14px 18px;background:linear-gradient(160deg,#dcc08a,var(--manila-d));border-radius:8px;transform:rotate(1.2deg);box-shadow:var(--shadow)}
.dfolder::before{content:"";position:absolute;top:-22px;right:60px;width:150px;height:28px;background:#d6b97f;border-radius:8px 8px 0 0}
.dsheet{position:relative;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.dsheet.ghost{position:absolute;inset:18px 0 10px 0}
.dsheet.g2{transform:rotate(-1.4deg) translate(-6px,4px);background:#ece3cf}
.dsheet.g1{transform:rotate(.7deg) translate(4px,2px);background:#f0e8d6}
.dmain{padding:34px 40px 40px;background-color:var(--surface);
  background-image:radial-gradient(ellipse at 20% 0%,rgba(255,255,255,.5),transparent 60%),radial-gradient(ellipse at 100% 100%,rgba(140,110,60,.12),transparent 55%)}
.pin{position:absolute;top:12px;left:16px;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a7a,#b3241a 55%,#6e120c);box-shadow:2px 3px 3px rgba(0,0,0,.35)}
.dbar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--black);color:#f4eddd;padding:8px 16px;font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.06em;text-transform:uppercase}
.dbar .dno{font-family:var(--type);font-size:13px;font-weight:400;letter-spacing:.04em}
.dbar.thin{font-size:17px;padding:5px 14px}
.dtop{display:grid;grid-template-columns:minmax(0,1fr) 260px;border:1.5px solid var(--black);border-top:0;margin-bottom:0}
.dinfo{padding:18px 20px 14px;border-right:1.5px solid var(--black);min-width:0}
.dcat{display:flex;gap:6px;margin-bottom:4px}
.dname{font-family:var(--display);font-weight:700;font-size:54px;line-height:1.05;letter-spacing:.02em;word-break:break-word}
.dalias{font-family:var(--type);color:var(--muted);margin-top:4px}
.drows{margin:14px 0 0;display:flex;flex-direction:column}
.drow{display:grid;grid-template-columns:max-content 1fr;gap:10px;padding:6px 2px;border-bottom:1px solid #a99b82;align-items:baseline}
.drow dt{font-family:var(--type);font-size:13px;color:#3d342a;text-transform:uppercase}
.drow dt::after{content:"："}
.drow dd{margin:0;font-family:var(--type);font-size:16px;font-variant-numeric:tabular-nums;min-width:0;word-break:break-word}
.dphoto{position:relative;padding:16px;display:flex;align-items:center;justify-content:center}
.dphoto img{width:100%;aspect-ratio:4/5;object-fit:cover;border:5px solid #2a2622;box-shadow:3px 4px 8px rgba(0,0,0,.3);cursor:zoom-in;background:var(--paper2)}
.dphoto .clip{top:2px;right:34px;width:18px;height:52px}
.dstamp{position:absolute;left:-34px;bottom:4px;width:96px;height:96px;border-radius:50%;border:3px double var(--accent);color:var(--accent);display:grid;place-content:center;text-align:center;transform:rotate(-14deg);opacity:.72;font-family:var(--display);font-weight:700;font-size:20px;line-height:1.1;pointer-events:none;mix-blend-mode:multiply}
.dstamp small{font-family:var(--type);font-size:10px;font-weight:400;letter-spacing:.08em}
.dappear{display:flex;flex-wrap:wrap;border:1.5px solid var(--black);border-top:0}
.acell{display:flex;align-items:center;gap:10px;padding:7px 14px;border-right:1.5px solid var(--black);font-family:var(--type);font-size:14px;flex:1 1 auto}
.acell:last-child{border-right:0}
.acell span{text-transform:uppercase;color:#3d342a}
.acell span::after{content:"："}
.acell i{width:26px;height:22px;flex:none;border:1px solid rgba(0,0,0,.35);margin-left:auto}
.dextras{display:flex;gap:30px;align-items:flex-start;padding:22px 10px 6px;min-height:40px}
.polaroid{margin:0;position:relative;width:190px;background:#fbf8f1;padding:9px 9px 26px;box-shadow:2px 4px 10px rgba(0,0,0,.3);transform:rotate(-4deg)}
.polaroid img{width:100%;aspect-ratio:1/1;object-fit:cover;cursor:zoom-in}
.polaroid figcaption{position:absolute;left:10px;right:10px;bottom:5px;font-family:var(--type);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tape{position:absolute;top:-12px;left:50%;width:76px;height:24px;margin-left:-38px;background:rgba(236,215,140,.72);transform:rotate(-6deg);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.keywords{font-family:var(--type);font-size:14px;line-height:2;color:#3d342a;flex:1;min-width:0;padding-top:6px}
.keywords b{font-family:var(--display);letter-spacing:.06em;margin-right:6px}
.dtabs{display:flex;gap:22px;margin:26px 0 0;border-bottom:2px solid var(--black);overflow-x:auto;padding-left:4px;align-items:flex-end}
.tgroup{display:flex;flex-direction:column;gap:3px;flex:none}
.tglabel{font-family:"Oswald",var(--type);font-size:11px;letter-spacing:.14em;color:var(--muted);padding-left:4px;border-left:2px solid var(--accent);line-height:1.2}
.tgtabs{display:flex;gap:4px}
.addtab{border:1px dashed #b3a385;border-bottom:0;background:transparent;padding:7px 12px 5px;cursor:pointer;color:var(--muted);border-radius:6px 6px 0 0;white-space:nowrap;font-size:13px}
.tabedit{display:flex;justify-content:flex-end;margin:-8px 0 12px}
.dtabs button{border:1px solid #b3a385;border-bottom:0;background:var(--manila);padding:7px 15px 5px;cursor:pointer;color:#4a3b25;font-weight:700;border-radius:6px 6px 0 0;white-space:nowrap;font-size:14px}
.dtabs button.on{background:var(--black);color:#f4eddd;border-color:var(--black)}
.dcontent{padding-top:22px}
.prose{max-width:66ch;white-space:pre-wrap}
.sec{margin-bottom:26px}
.sec h3{display:inline-block;font-size:15px;letter-spacing:.08em;background:var(--black);color:#f4eddd;padding:2px 12px;margin-bottom:10px}
.dcontent .prose{font-family:var(--type);font-size:15.5px;line-height:1.9}
.rel-list{display:flex;flex-direction:column;gap:6px}
.rel-row{display:flex;align-items:center;gap:10px;background:var(--paper2);border:1px solid var(--line);border-radius:3px;padding:6px 10px;cursor:pointer;text-align:left;flex-wrap:wrap}
.rel-row img{width:34px;height:34px;border-radius:50%;object-fit:cover}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:28px 22px;padding:6px 4px}
.gitem{margin:0;background:#fbf8f1;padding:9px 9px 10px;box-shadow:2px 4px 10px rgba(0,0,0,.22);transform:rotate(var(--r,0deg))}
.gitem img{width:100%;aspect-ratio:1/1;object-fit:cover;cursor:zoom-in;background:var(--paper2)}
.gitem .cap{padding:8px 2px 0;display:grid;gap:2px;font-size:13px;font-family:var(--type)}
.gitem .cap b{font-family:var(--display);font-size:16px;letter-spacing:.03em}
.kv{display:grid;grid-template-columns:3em 1fr;gap:6px}
.kv span:first-child{color:var(--muted)}
@media (max-width:760px){
  .dmain{padding:30px 18px 28px}
  .dtop{grid-template-columns:1fr}
  .dinfo{border-right:0;border-bottom:1.5px solid var(--black)}
  .dphoto{max-width:300px;margin:0 auto}
  .dstamp{left:auto;right:-6px;bottom:-10px;width:80px;height:80px;font-size:16px}
  .dname{font-size:40px}
  .dextras{flex-direction:column;align-items:center}
}

/* 紙張頁面（關係表、時間軸、站長的話） */
.sheet{background:var(--surface);padding:30px 34px 36px;box-shadow:var(--shadow);position:relative}
.sheet::before{content:"";position:absolute;top:0;left:0;right:0;height:8px;background:var(--black)}
.head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.sheet h1{font-family:var(--display);letter-spacing:.04em}
@media (max-width:520px){.sheet{padding:24px 16px 28px}}
.panel{background:var(--paper2);border:1px solid var(--line);border-radius:3px;padding:16px}
.graph-wrap{overflow-x:auto}
svg.graph{display:block;margin:0 auto;max-width:100%;height:auto}
svg .edge{stroke:var(--muted);stroke-width:1.5;fill:none;opacity:.75}
svg .elabel rect{fill:var(--surface);stroke:var(--line)}
svg .elabel text{fill:var(--ink);font-size:12px;font-family:var(--body)}
svg .node{cursor:pointer}
svg .nname text{fill:var(--ink);font-size:14px;font-weight:700;font-family:var(--body);paint-order:stroke;stroke:var(--paper2);stroke-width:5px;stroke-linejoin:round}
svg .elabel{pointer-events:none}
svg .node circle.ring{stroke-width:3;fill:var(--surface)}
svg.graph.focus .edge,svg.graph.focus .elabel,svg.graph.focus .node,svg.graph.focus .nname{opacity:.15}
svg.graph.focus .hl{opacity:1!important}
svg .arrow{fill:var(--muted)}
.sheet .seg{background:var(--paper2);border-color:var(--line)}
.sheet .seg button{color:var(--muted)}
.sheet .seg button+button{border-left-color:var(--line)}
.sheet .seg button.on{background:var(--black);color:var(--surface)}
table.rt{width:100%;border-collapse:collapse;font-size:14px}
table.rt th,table.rt td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.rt th{font-size:12px;color:var(--muted);font-weight:500}
table.rt a{color:var(--ink)}
.row-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:6px 10px}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;margin-top:16px}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.tl{position:relative;margin-left:8px;padding-left:28px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:18px}
.ev{position:relative;background:var(--paper2);border:1px solid var(--line);border-radius:3px;padding:12px 16px;max-width:760px}
.ev::before{content:"";position:absolute;left:-36px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.ev.auto::before{border-color:var(--muted)}
.ev.auto{background:transparent;border-style:dashed}
.ev .d{font-variant-numeric:tabular-nums;color:var(--accent);font-family:var(--type);font-size:13px}
.ev.auto .d{color:var(--muted)}
.ev h3{font-size:19px;margin:2px 0 4px}
.ev .acts{position:absolute;top:10px;right:10px;display:flex;gap:4px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:1px 10px 1px 2px;background:var(--surface);cursor:pointer}
.chip img{width:22px;height:22px;border-radius:50%;object-fit:cover}
.year-mark{font-family:var(--display);font-weight:700;font-size:24px;margin-left:-28px;position:relative;background:var(--surface);letter-spacing:.04em}
.picks{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- 圖片 ---------- */
var IMG_MAX = 1500, IMG_Q = 0.88;
var IMG_HINT = '<span class="imghint">長邊最多 '+IMG_MAX+' 像素・JPG 格式（上傳時會自動調整）<br>・JPG 不支援透明背景，去背 PNG 的透明處會變成白色<br>・會動的 GIF 只會留下第一格畫面</span>';
function toJpeg(file){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onload = function(){
      var im = new Image();
      im.onload = function(){
        var w = im.naturalWidth || im.width, h = im.naturalHeight || im.height, k = Math.min(1, IMG_MAX/Math.max(w,h));
        var cv = document.createElement("canvas"); cv.width = Math.max(1, Math.round(w*k)); cv.height = Math.max(1, Math.round(h*k));
        var ctx = cv.getContext("2d"); ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,cv.width,cv.height);
        ctx.imageSmoothingQuality = "high"; ctx.drawImage(im,0,0,cv.width,cv.height);
        res(cv);
      };
      im.onerror = rej; im.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
function readImage(file){
  if(GH) return toJpeg(file).then(function(cv){
    var dataUrl = cv.toDataURL("image/jpeg", IMG_Q), path = "images/" + Date.now().toString(36) + Math.random().toString(36).slice(2,6) + ".jpg";
    setStatus("上傳圖片中…", false);
    return ghApi("/contents/"+path, {method:"PUT", body:{message:"上傳圖片", content:dataUrl.split(",")[1], branch:GH.branch}}).then(function(){
      imgCache[path] = dataUrl; setStatus("圖片已上傳", false); return path;
    });
  });
  return toJpeg(file).then(function(cv){
    if(assets){
      return new Promise(function(res){ cv.toBlob(res, "image/jpeg", IMG_Q); }).then(function(blob){
        if(!blob) throw 0;
        return assets.upload(blob).then(function(r){ return "/_blob/" + r.id; });
      }).catch(function(){ return cv.toDataURL("image/jpeg", IMG_Q); });
    }
    return cv.toDataURL("image/jpeg", IMG_Q);
  });
}

function graphSVG(ego){
  var nodes = [], ids = {}, edges = [];
  function addNode(n){ if(!ids[n.id]){ ids[n.id] = n; nodes.push(n); } }
  function charNode(c){ return {id:c.id, name:c.name, img:cover(c), color:color(c.color), ext:false}; }
  if(ego){
    var me = byId(ego); addNode(charNode(me));
    relsOf(ego).forEach(function(r){ var o = relOther(r, ego); if(!o) return; addNode(o); edges.push({r:r, from: r.a===ego ? ego : o.id, to: r.a===ego ? o.id : ego}); });
  } else {
    state.chars.filter(function(c){ var rc = ui.relCat||"全部"; if(rc!=="全部" && c.cat!==rc) return false; if(ui.relProj && hasSub(rc) && (c.project||"__none")!==ui.relProj) return false; return true; }).forEach(function(c){ addNode(charNode(c)); });
    state.relations.forEach(function(r){
      if(!ids[r.a] || ids[r.a].ext) return;
      if(r.ext){ var o = relOther(r, r.a); addNode(o); edges.push({r:r, from:r.a, to:o.id}); }
      else if(ids[r.b] && r.a!==r.b) edges.push({r:r, from:r.a, to:r.b});
    });
  }
  if(!nodes.length) return '<div class="empty">這裡沒有角色。</div>';
  var pos = {}, n = nodes.length, W, H, cx, cy, R;
  if(ego){
    var k = n-1; R = k<=1 ? 190 : Math.max(220, k*42); W = R*2+240; H = R*2+190; cx = W/2; cy = H/2;
    pos[nodes[0].id] = {x:cx, y:cy};
    nodes.slice(1).forEach(function(nd,i){ var a = -Math.PI/2 + i*2*Math.PI/Math.max(k,1); pos[nd.id] = {x:cx+R*Math.cos(a), y:cy+R*Math.sin(a)}; });
  } else {
    R = n<=2 ? 150 : Math.max(200, n*42); W = R*2+240; H = R*2+190; cx = W/2; cy = H/2;
    nodes.forEach(function(nd,i){ var a = -Math.PI/2 + i*2*Math.PI/n; pos[nd.id] = {x:cx+R*Math.cos(a), y:cy+R*Math.sin(a)}; });
  }
  var foc = !ego && ui.focus && ids[ui.focus] ? ui.focus : null;
  var out = '<svg class="graph'+(foc?" focus":"")+'" viewBox="0 0 '+W+' '+H+'" width="'+W+'" role="img" aria-label="角色關係圖"><defs><marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0,0 L10,5 L0,10 z"/></marker>';
  nodes.forEach(function(nd,i){ out += '<clipPath id="cp'+i+'"><circle cx="'+pos[nd.id].x+'" cy="'+pos[nd.id].y+'" r="27"/></clipPath>'; });
  out += '</defs>';
  var labels = "";
  edges.forEach(function(e){
    var r = e.r, p = pos[e.from], q = pos[e.to], dx = q.x-p.x, dy = q.y-p.y, Ln = Math.sqrt(dx*dx+dy*dy)||1, ux = dx/Ln, uy = dy/Ln;
    var rev = edges.some(function(o){ return o!==e && o.from===e.to && o.to===e.from; });
    var sx = p.x+ux*36, sy = p.y+uy*36, ex = q.x-ux*38, ey = q.y-uy*38;
    var off = rev ? 28 : 0, mx = (sx+ex)/2 - uy*off, my = (sy+ey)/2 + ux*off;
    var hl = foc && (e.from===foc||e.to===foc) ? " hl" : "";
    out += '<path class="edge'+hl+(r.ext?" dashed":"")+'" d="M'+sx+','+sy+' Q'+(2*mx-(sx+ex)/2)+','+(2*my-(sy+ey)/2)+' '+ex+','+ey+'" '+(r.mutual?'marker-start="url(#arr)" ':'')+'marker-end="url(#arr)"/>';
    var lw = Math.max(40, String(r.label||"").length*13+16);
    labels += '<g class="elabel'+hl+'"><rect x="'+(mx-lw/2)+'" y="'+(my-11)+'" width="'+lw+'" height="22" rx="11"/><text x="'+mx+'" y="'+(my+4)+'" text-anchor="middle">'+esc(r.label||"")+'</text></g>';
  });
  var names = "";
  nodes.forEach(function(nd,i){
    var p = pos[nd.id], hl = foc && (foc===nd.id || edges.some(function(e){ return (e.from===foc&&e.to===nd.id)||(e.to===foc&&e.from===nd.id); })) ? " hl" : "";
    var big = ego && i===0, isCenter = ego && i===0;
    out += '<g class="node'+hl+(nd.ext?" ext":"")+'" '+(nd.ext?'':'data-node="'+esc(nd.id)+'" tabindex="0"')+'><circle class="ring" cx="'+p.x+'" cy="'+p.y+'" r="'+(big?32:30)+'" stroke="'+nd.color+'"/>'+
      '<image href="'+nd.img+'" x="'+(p.x-27)+'" y="'+(p.y-27)+'" width="54" height="54" preserveAspectRatio="xMidYMin slice" clip-path="url(#cp'+i+')"/></g>';
    var up = !isCenter && (p.y - cy) < -20;
    var owner = nd.ext ? (nd.owner ? nd.owner+" 的角色" : "他人角色") : "";
    var y1 = up ? p.y - (owner ? 60 : 44) : p.y + 52, y2 = y1 + 16;
    names += '<g class="nname'+hl+'"><text x="'+p.x+'" y="'+y1+'" text-anchor="middle">'+esc(nd.name)+'</text>'+
      (owner?'<text class="owner-t" x="'+p.x+'" y="'+y2+'" text-anchor="middle">'+esc(owner)+'</text>':'')+'</g>';
  });
  out += labels + names;
  return out + '</svg>';
}

      : '<div class="fgrid"><div class="field"><label for="r-b">對方角色</label><select id="r-b" data-r="b"><option value="">請選擇</option>'+opts(d.b, d.a)+'</select></div></div>')+

function modal(html, cls){

  bg.addEventListener("mousedown", function(e){ if(e.target===bg) bg.remove(); });
  document.body.appendChild(bg);
  var f = bg.querySelector("input,textarea,select,button"); if(f) f.focus();
  return bg;
}

/* 匯出公開網站 */
function blobToDataURL(b){ return new Promise(function(res, rej){ var fr = new FileReader(); fr.onload = function(){ res(fr.result); }; fr.onerror = rej; fr.readAsDataURL(b); }); }
function exportSite(btn, msg){
  function say(x){ if(msg) msg.textContent = x; }
  btn.disabled = true; say("準備中…");
  var ex = JSON.parse(JSON.stringify(state));
  ex.chars.forEach(function(c){ c.stories = (c.stories||[]).filter(function(x){ return x.public!==false; }); delete c.example; });
  ex.settings.exportMode = true;
  var srcs = [], add = function(x){ if(x && /^\/_blob\//.test(x) && srcs.indexOf(x)<0) srcs.push(x); };
  ex.chars.forEach(function(c){ ["mainImages","outfits","gallery"].forEach(function(k){ (c[k]||[]).forEach(function(it){ add(it.src); }); }); });
  ex.relations.forEach(function(r){ if(r.ext) add(r.ext.img); });
  add(ex.settings.notesImg);
  var map = {}, failed = 0, done = 0;
  Promise.all(srcs.map(function(src){
    return fetch(src).then(function(r){ if(!r.ok) throw 0; return r.blob(); }).then(blobToDataURL).then(function(u){ map[src] = u; })
      .catch(function(){ failed++; }).then(function(){ done++; say("打包圖片 "+done+" / "+srcs.length); });
  })).then(function(){
    var json = JSON.stringify(ex);
    Object.keys(map).forEach(function(src){ json = json.split(JSON.stringify(src)).join(JSON.stringify(map[src])); });
    var doc = buildDoc(json);
    var mb = (doc.length/1048576).toFixed(1);
    return Promise.resolve(use ? use("downloads") : null).then(function(dl){
      if(!dl){ say("這裡無法下載檔案，請在 claude.ai 上打開網站再試一次。"); return; }
      return dl.save({filename:"index.html", data:new Blob([doc], {type:"text/html"})}).then(function(){
        say("已匯出（約 "+mb+" MB）"+(failed?"，有 "+failed+" 張圖片讀不到，公開版裡會顯示預設剪影":"")+"。");
      }).catch(function(e){ var c = e && e.code; say(c==="declined" ? "已取消下載。" : "匯出失敗，請再試一次。"); });
    });
  }).catch(function(){ say("匯出失敗，請再試一次。"); }).then(function(){ btn.disabled = false; });
}

          '<div class="field"><label for="cs'+i+'">第二層名稱</label><input id="cs'+i+'" data-ci="'+i+'" data-ck="sub" placeholder="例如：企劃名稱、劇本名稱" value="'+esc(x.sub||"")+'"></div>'+
          '<div class="catacts"><span class="hint">'+count(x.id)+' 位</span>'+(i>0?'<button class="btn sm ghost" type="button" data-cmv="'+i+'" data-dir="-1">上移</button>':'')+(i<cd.length-1?'<button class="btn sm ghost" type="button" data-cmv="'+i+'" data-dir="1">下移</button>':'')+
          '<button class="btn sm ghost" type="button" data-cdel="'+i+'">刪除</button></div></div>';
      }).join("")+
      '<button class="btn sm" type="button" data-cadd style="margin-top:10px">＋ 新增分類</button>'+
      '<p class="hint">刪除分類時，裡面的角色不會被刪掉，會變成「未分類」，之後可以在編輯角色時重新選分類。</p>'+
      '<div class="mfoot"><button class="btn" type="button" data-x>取消</button><button class="btn primary" type="button" data-s>儲存分類</button></div>';
    if(!m) m = modal(html, "small wide2"); else m.querySelector(".modal").innerHTML = html;
  }
  paint();
  m.addEventListener("input", function(e){ var t = e.target; if(t.dataset.ci!==undefined) cd[+t.dataset.ci][t.dataset.ck] = t.value; });
  m.addEventListener("click", function(e){
    var t = e.target.closest("button"); if(!t) return;
    if(t.hasAttribute("data-x")) m.remove();
    else if(t.hasAttribute("data-cadd")){ cd.push({id:uid("k"), name:"新分類", sub:"", color:"#7a5a3a"}); paint(); var ins = m.querySelectorAll('[data-ck="name"]'); ins[ins.length-1].select(); }
    else if(t.dataset.cmv!==undefined){ var i0 = +t.dataset.cmv, i1 = i0 + (+t.dataset.dir), tmp = cd[i0]; cd[i0] = cd[i1]; cd[i1] = tmp; paint(); }
    else if(t.dataset.cdel!==undefined){ var x = cd[+t.dataset.cdel], n = count(x.id);
      if(n){ confirmBox("「"+x.name+"」裡有 "+n+" 位角色，刪除後他們會變成未分類。確定要刪除嗎？", function(){ cd.splice(+t.dataset.cdel,1); paint(); }); }
      else { cd.splice(+t.dataset.cdel,1); paint(); } }
    else if(t.hasAttribute("data-s")){
      if(cd.some(function(x){ return !String(x.name).trim(); })){ toast("每個分類都要有名稱"); return; }
      cd.forEach(function(x){ x.name = x.name.trim(); x.sub = (x.sub||"").trim(); });
      var keep = {}; cd.forEach(function(x){ keep[x.id] = 1; });
      state.chars.forEach(function(c){ if(c.cat && !keep[c.cat]) c.cat = ""; });
      state.settings.cats = cd; if(!keep[ui.cat]) ui.cat = "全部"; if(!keep[ui.relCat]){ ui.relCat = "全部"; ui.relProj = ""; }
      m.remove(); save(); render(); toast("分類已儲存");
    }
  });
}

/* 設定與備份 */
function settings(){
  var lb = state.settings.labels;
  var labelsHTML = LABEL_DEFS.map(function(g){ return '<fieldset><legend>'+esc(g[0])+'</legend><div class="fgrid">'+g[1].map(function(p){
      return '<div class="field"><label for="lb-'+p[0]+'">預設：'+esc(p[1])+'</label><input id="lb-'+p[0]+'" data-label="'+p[0]+'" placeholder="'+esc(p[1])+'" value="'+esc(lb[p[0]]||"")+'"></div>'; }).join("")+'</div></fieldset>'; }).join("");
  var m = modal('<h2>設定與備份</h2>'+
    '<div class="field" style="margin-top:12px"><label>字體風格</label><div class="fontpick">'+[["serif","明朝檔案","端正的明體，像印刷的檔案"],["kai","文楷手札","帶點手寫感的楷體"],["sans","俐落黑體","乾淨現代的黑體"]].map(function(f){
      return '<label class="fopt font-'+f[0]+'"><input type="radio" name="s-font" value="'+f[0]+'" '+((state.settings.font||"serif")===f[0]?"checked":"")+'><b>'+f[1]+'</b><span>'+f[2]+'</span><em>白鷺澪的檔案 2023</em></label>'; }).join("")+'</div></div>'+
    '<label class="check" style="margin:14px 0 4px"><input type="checkbox" id="s-prot" '+(state.settings.protectImages!==false?"checked":"")+'>訪客瀏覽時保護圖片（停用右鍵、拖曳和長按另存）</label>'+
    '<p class="muted" style="font-size:13px">備份會把所有角色、關係和時間軸複製成一段文字，可以貼到記事本保存。用「匯入」貼回去就能還原。</p>'+
    (GH?'':'<div class="exportbox needs-write"><b>匯出公開網站</b><p class="hint">產生一份可以直接放上 GitHub Pages 的 index.html。圖片會一起打包進去，編輯功能和不公開的故事都會移除。</p><button class="btn primary" data-export>匯出公開網站</button><span class="hint" id="exp-msg"></span></div>')+
    '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-copy>複製備份文字</button><button class="btn needs-write" data-imp>匯入備份</button>'+
    '<button class="btn danger needs-write" data-clr>刪除所有範例角色</button><button class="btn needs-write" data-mcats>管理分類</button></div>'+
    '<h2 style="margin-top:26px;font-size:20px">標題文字</h2><p class="hint">把網站上的標題換成你想要的文字。留空就使用預設文字。</p>'+labelsHTML+
    '<div style="margin-top:10px"><button class="btn sm" data-lbreset>全部恢復預設</button></div>'+
    '<div class="field" id="imp-box" style="display:none;margin-top:12px"><label for="s-imp">貼上備份文字</label><textarea id="s-imp"></textarea><button class="btn primary sm" data-doimp style="margin-top:6px;align-self:flex-start">確定匯入（會取代現有資料）</button></div>'+
    '<div class="mfoot"><button class="btn" data-x>關閉</button><button class="btn primary needs-write" data-s>儲存設定</button></div>');
  m.addEventListener("click", function(e){
    var t = e.target.closest("button"); if(!t) return;
    if(t.hasAttribute("data-x")) m.remove();
    else if(t.hasAttribute("data-s")){ state.settings.protectImages = m.querySelector("#s-prot").checked;
      var fr = m.querySelector('input[name="s-font"]:checked'); if(fr) state.settings.font = fr.value;
      var nl = {}; [].forEach.call(m.querySelectorAll("[data-label]"), function(x){ var v = x.value.trim(); if(v && v!==LABEL_DEFAULT[x.dataset.label]) nl[x.dataset.label] = v; }); state.settings.labels = nl; m.remove(); save(); applyMode(); }
    else if(t.hasAttribute("data-mcats")){ m.remove(); manageCats(); }
    else if(t.hasAttribute("data-lbreset")){ [].forEach.call(m.querySelectorAll("[data-label]"), function(x){ x.value = ""; }); toast("已清空，按「儲存設定」後生效"); }
    else if(t.hasAttribute("data-export")){ exportSite(t, m.querySelector("#exp-msg")); }
    else if(t.hasAttribute("data-copy")){
      var txt = JSON.stringify(state);
      navigator.clipboard.writeText(txt).then(function(){ toast("已複製備份文字"); }).catch(function(){ m.querySelector("#imp-box").style.display="flex"; m.querySelector("#s-imp").value = txt; m.querySelector("#s-imp").select(); toast("無法自動複製，請手動複製下方文字"); });
    }
    else if(t.hasAttribute("data-imp")){ m.querySelector("#imp-box").style.display = "flex"; m.querySelector("#s-imp").value = ""; m.querySelector("#s-imp").focus(); }
    else if(t.hasAttribute("data-doimp")){
      try{ var s = JSON.parse(m.querySelector("#s-imp").value); if(!s || !Array.isArray(s.chars)) throw 0; state = s; state.relations = s.relations||[]; state.timeline = s.timeline||[]; state.settings = s.settings||{siteTitle:"原創角色檔案館"}; m.remove(); save(); go(""); toast("已匯入"); }
      catch(err){ toast("這段文字不是有效的備份，請確認有完整貼上"); }
    }
    else if(t.hasAttribute("data-clr")){
      confirmBox("要刪除所有標示「範例」的角色，以及他們的關係和事件嗎？", function(){
        var gone = {}; state.chars.forEach(function(c){ if(c.example) gone[c.id]=1; });
        state.chars = state.chars.filter(function(c){ return !gone[c.id]; });
        state.relations = state.relations.filter(function(r){ return !gone[r.a] && !gone[r.b]; });
        state.timeline = state.timeline.filter(function(e){ e.chars = (e.chars||[]).filter(function(id){return !gone[id];}); return e.chars.length || ["t1","t2","t3"].indexOf(e.id)<0; });
        m.remove(); save(); go(""); toast("範例已刪除");
      });
    }
  });
}

/* ---------- 事件委派 ---------- */
root.addEventListener("click", function(e){
  var t = e.target;
  var g = t.closest("[data-go]"); if(g){ go(g.getAttribute("data-go")); return; }
  var b = t.closest("button,[data-node],[data-zoom]"); if(!b) return;
  var ds = b.dataset;
  if(ds.cat){ ui.cat = ds.cat; keepUI(); render(); }
  else if(ds.gender){ ui.gender = ds.gender; keepUI(); render(); }
  else if(ds.sort){ ui.sort = ds.sort; keepUI(); render(); }
  else if(ds.tab){ ui.tab = ds.tab; keepUI(); render(); }
  else if(ds.relcat){ ui.relCat = ds.relcat; ui.focus = null; render(); }
  else if(ds.node){ if(ui.relEgo){ ui.relEgo = ds.node; var nc = byId(ds.node); if(nc){ ui.relCat = nc.cat; ui.relProj = nc.project || "__none"; } } else { ui.focus = ui.focus===ds.node ? null : ds.node; } keepUI(); render(); }
  else if(b.hasAttribute("data-relreset")){ ui.relCat = "全部"; ui.relProj = ""; ui.relEgo = ""; ui.focus = null; keepUI(); render(); }
  else if(ds.relego!==undefined){ ui.relEgo = ds.relego; ui.focus = null; keepUI(); render(); }
  else if(ds.relgo){ ui.relEgo = ds.relgo; var gc = byId(ds.relgo); if(gc){ ui.relCat = gc.cat; ui.relProj = gc.project || "__none"; } keepUI(); go("relations"); }
  else if(ds.fold){ ui[ds.fold] = ui[ds.fold]===false; keepUI(); render(); }
  else if(ds.redit){ editRel(ds.redit); }
  else if(ds.zoom==="notes"){ lightbox({name:"", notes:[{src:state.settings.notesImg, note:state.settings.notesCaption}]}, "notes", 0); }
  else if(ds.zoom){ var c = byId(route().id); if(c) lightbox(c, ds.zoom, +ds.i); }
  else if(ds.rdel){ state.relations = state.relations.filter(function(r){return r.id!==ds.rdel;}); save(); render(); }
  else if(ds.ev!==undefined){ editEvent(ds.ev, (ds.pre||"").split(",").filter(Boolean)); }
  else if(ds.tlmode){
    if(ds.tlmode==="all"){ ui.tlMode = "all"; }
    else { ui.tlMode = "pick"; ui.tlMulti = ds.tlmode==="multi"; var p = tlPicked(); if(!ui.tlMulti) ui.tlChars = p.slice(0,1); }
    keepUI(); render();
  }
  else if(ds.tlc){
    var cur = tlPicked();
    if(ui.tlMode==="all"){ ui.tlMode = "pick"; ui.tlChars = [ds.tlc]; }
    else if(ui.tlMulti){ var k = cur.indexOf(ds.tlc); if(k>=0){ if(cur.length>1) cur.splice(k,1); } else cur.push(ds.tlc); ui.tlChars = cur; }
    else ui.tlChars = [ds.tlc];
    keepUI(); render();
  }
  else if(ds.tlone){ ui.tlMode = "pick"; ui.tlMulti = false; ui.tlChars = [ds.tlone]; keepUI(); go("timeline"); }
  else if(ds.evdel){ confirmBox("要刪除這個事件嗎？", function(){ state.timeline = state.timeline.filter(function(x){return x.id!==ds.evdel;}); save(); render(); }); }
  else if(ds.act==="group"){ ui.group = !ui.group; keepUI(); render(); }
  else if(ds.act==="new"){ editChar(null); }
  else if(ds.act==="edit"){ editChar(ds.id, ds.sec || null); }
  else if(ds.act==="settings"){ settings(); }
  else if(ds.act==="cats"){ manageCats(); }
  else if(ds.act==="ghlogin"){ loginBox(); }
  else if(ds.act==="ghlogout"){ ghLogout(); }
  else if(ds.act==="notes"){ editNotes(); }
  else if(ds.act==="guest"){ ui.guest = !ui.guest; keepUI(); applyMode(); toast(ui.guest?"已切換為訪客模式":"已回到編輯模式"); }
  else if(ds.act==="del"){ var cc = byId(ds.id); confirmBox("要刪除「"+cc.name+"」嗎？他的關係也會一起刪除。", function(){
      state.chars = state.chars.filter(function(x){return x.id!==ds.id;});
      state.relations = state.relations.filter(function(r){return r.a!==ds.id && r.b!==ds.id;});
      state.timeline.forEach(function(ev){ ev.chars = (ev.chars||[]).filter(function(i){return i!==ds.id;}); });
      save(); go(""); });
  }
  else if(ds.act==="newrel"){ editRel(null, ds.id || ui.relEgo || ""); }
});
root.addEventListener("input", function(e){
  if(e.target.id==="q"){ ui.q = e.target.value; keepUI(); var pos = e.target.selectionStart; render(); var q = root.querySelector("#q"); q.focus(); try{q.setSelectionRange(pos,pos);}catch(x){} }
});
root.addEventListener("change", function(e){
  var t = e.target;
  if(t.id==="relego"){ ui.relEgo = t.value; ui.focus = null; if(t.value){ var ec = byId(t.value); ui.relCat = ec.cat; ui.relProj = ec.project || "__none"; } keepUI(); render(); }
  else if(t.id==="relcat2"){ ui.relCat = t.value; ui.relProj = ""; ui.relEgo = ""; ui.focus = null; keepUI(); render(); }
  else if(t.id==="relproj"){ ui.relProj = t.value; ui.relEgo = ""; ui.focus = null; keepUI(); render(); }
  else if(t.id==="showc"){ ui.showCreated = t.checked; keepUI(); render(); }
});

/* ---------- 圖片保護 ---------- */
function isProtected(t){ return document.body.classList.contains("protect") && t && t.closest && t.closest("img,image,.portrait,.gitem,.lightbox,.card .pic"); }
document.addEventListener("contextmenu", function(e){ if(isProtected(e.target)){ e.preventDefault(); toast("圖片受作者保護，請勿下載或轉載"); } });
document.addEventListener("dragstart", function(e){ if(isProtected(e.target)) e.preventDefault(); });

/* ---------- 啟動 ---------- */
try{ var lh = sessionStorage.getItem("oc-hash"); if(lh && !location.hash){ sessionStorage.removeItem("oc-hash"); history.replaceState(null,"",lh); } }catch(e){}
document.body.classList.add("ro","protect","font-"+(state.settings.font||"serif"));
render();
var use = (!GH && !state.settings.exportMode && window.claude && typeof window.claude.use === "function") ? window.claude.use.bind(window.claude) : null;
function none(){ return null; }
if(GH){
  use = null;
  var savedTk = null, savedLocal = false; try{ savedLocal = !!localStorage.getItem("oc-gh-token"); savedTk = localStorage.getItem("oc-gh-token") || sessionStorage.getItem("oc-gh-token"); }catch(e){}
  var loadPublic = function(){ return fetch("data.json?v="+Date.now(), {cache:"no-store"}).then(function(r){ if(!r.ok) throw 0; return r.json(); }); };
  (savedTk ? ghLogin(savedTk, savedLocal).then(ghLoad).then(function(d){ canEdit = true; return d; }).catch(function(){ try{ localStorage.removeItem("oc-gh-token"); }catch(e){} return loadPublic(); }) : loadPublic())
    .then(function(d){ state = d; normalize(); setStatus(canEdit ? "已登入，修改會存到 GitHub" : "", false); applyMode(); })
    .catch(function(){ root.innerHTML = '<div class="wrap" style="padding:60px 20px;color:#f1e6d0">資料載入失敗，請重新整理頁面。</div>'; });
} else if(use){
  Promise.all([use("artifact").catch(none), use("assets").catch(none), use("user").catch(none)]).then(function(r){
    art = r[0]; assets = r[1]; connected = !!art;
    var u = r[2];
    return (u ? Promise.resolve().then(function(){ return u.canEdit(); }).catch(none) : Promise.resolve(null)).then(function(ce){
      canEdit = !!art && (ce===true || ((ce===null || ce===undefined) && !!assets));
      setStatus(canEdit ? "修改會自動保存" : "", false);
      applyMode();
    });
  });
} else { setStatus(state.settings.exportMode ? "" : "預覽模式：修改不會保存", !state.settings.exportMode); }
})();
</script>
