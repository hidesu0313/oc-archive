<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>角色名單</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;family=Noto+Serif+TC:wght@400;500;700;900&amp;family=LXGW+WenKai+TC:wght@400;700&amp;family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;display=swap" rel="stylesheet">
<style id="css">/* [樣式] 版面：鵝黃茶會。淡鵝黃桌布底、白瓷色圓角卡片，下方懸浮選單；角色頁為一頁捲動的卡片 */
:root{
  --bg:#fbf3d6; --bg2:#f5e7bb; --surface:#fffdf6; --paper2:#fdf6e2;
  --ink:#4a3423; --muted:#8a735a; --line:#ecdcae; --black:#5b3f28;
  --accent:#c4766c; --sage:#8a9f74; --gold:#c4a052;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --latin:"Cormorant Garamond","Noto Serif TC",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --type:"Cormorant Garamond","Noto Serif TC",serif;
  --shadow:0 1px 2px rgba(120,90,40,.08),0 6px 18px rgba(120,90,40,.08);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7;min-height:100vh;background-color:var(--bg);
  background-image:radial-gradient(rgba(196,160,82,.22) 1.2px,transparent 1.6px);background-size:22px 22px}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.3;font-weight:700}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.spacer{flex:1}
.muted{color:var(--muted)}
main{padding:36px 0 120px}

/* [樣式] 按鈕 */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 16px;border-radius:999px;cursor:pointer;font-weight:500;line-height:1.4}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--black);color:#fffaf0;border-color:var(--black)}
.btn.danger{color:var(--accent);border-color:var(--accent)}
.btn.sm{padding:4px 12px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.ro .needs-write{display:none!important}
.editor-only{display:none!important}
.can-edit .editor-only{display:inline-flex!important}

/* [樣式] 懸浮選單 */
.dock{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:30;display:flex;gap:2px;padding:6px;background:rgba(255,253,246,.94);border:1px solid var(--line);border-radius:999px;box-shadow:0 8px 28px rgba(120,90,40,.18);backdrop-filter:blur(6px)}
.dock a{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:64px;padding:6px 12px 4px;border-radius:999px;text-decoration:none;color:var(--muted);font-family:var(--latin);font-size:12px;font-weight:600;letter-spacing:.08em;line-height:1.2}
.dock a svg{width:22px;height:22px}
.dock a:hover{color:var(--ink);background:var(--paper2)}
.dock a.on{color:var(--ink);background:var(--bg2)}
.dock .sunflower{width:24px;height:24px;transition:transform .4s}
.dock a.on .sunflower,.dock a:hover .sunflower{transform:rotate(22deg)}
.tools{position:fixed;right:18px;bottom:20px;z-index:31;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.fab{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.fab svg{width:20px;height:20px}
.fab.main{background:var(--black);color:#fffaf0;border-color:var(--black)}
.fab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.status{position:fixed;top:14px;right:18px;z-index:31;font-size:12px;color:var(--muted);background:rgba(255,253,246,.9);border:1px solid var(--line);border-radius:999px;padding:3px 12px}
.status:empty{display:none}
.status.warn{color:var(--accent);border-color:var(--accent)}
.guestbar{position:fixed;top:0;left:0;right:0;z-index:32;background:var(--accent);color:#fff;font-size:14px;text-align:center;padding:6px 12px}
.can-edit .guestbar.editor-only{display:block!important}
.guestbar .btn{margin-left:10px;background:#fff;color:var(--ink);border-color:#fff}
.foot{color:var(--muted);font-size:13px;padding:0 0 110px;text-align:center}
.footlink{background:none;border:0;color:var(--muted);font:inherit;text-decoration:underline;cursor:pointer;margin-left:14px;padding:0}
.footlink:hover{color:var(--ink)}
@media (max-width:520px){.dock a{min-width:54px;padding:6px 8px 4px;font-size:11px}.tools{bottom:84px;right:12px}.fab{width:42px;height:42px}}

/* [樣式] 頁面標題 */
.ptitle{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.ptitle h1{font-family:var(--latin);font-size:40px;font-weight:600;letter-spacing:.06em;line-height:1.1}
.ptitle .ornament{display:block;font-family:var(--body);font-size:13px;color:var(--muted);letter-spacing:.1em;margin-top:6px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:30px 34px 36px;box-shadow:var(--shadow)}
@media (max-width:520px){.sheet{padding:22px 16px 26px;border-radius:16px}.ptitle h1{font-size:32px}}
.head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.sheet h1{font-family:var(--latin);letter-spacing:.06em;font-weight:600}

/* [樣式] 列表篩選 */
.filters{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:4px 14px;cursor:pointer;font-size:14px}
.chips button.on{background:var(--black);border-color:var(--black);color:#fffaf0}
.chips .n{font-size:11px;margin-left:5px;opacity:.75}
.fsep{width:1px;height:22px;background:var(--line)}
.search{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 16px;min-width:200px}
.linkbtn{background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px;text-decoration:underline;padding:0}
.group-h{display:flex;align-items:baseline;gap:12px;margin:28px 0 12px}
.group-h h2{font-family:var(--latin);font-size:26px;font-weight:600}
.group-h span{color:var(--muted);font-size:13px}
.empty{padding:40px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:18px;background:rgba(255,253,246,.6)}

/* [樣式] 角色小卡 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ccard{display:flex;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;font:inherit;color:inherit;width:100%}
.ccard:hover{transform:translateY(-2px);border-color:var(--gold)}
.ccard .av{width:64px;height:64px;border-radius:50%;object-fit:cover;flex:none;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--cc)}
.ccard .info{min-width:0;display:flex;flex-direction:column;gap:3px}
.ccard .nm{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ccard .al{font-family:var(--latin);font-size:14px;color:var(--muted);font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ccard .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.ex{font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 6px}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:500;padding:0 9px;border-radius:999px;border:1px solid currentColor;line-height:1.7;white-space:nowrap}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;background:var(--paper2);border:1px solid var(--line);padding:0 9px;border-radius:999px;color:var(--muted)}

/* [樣式] 角色頁 */
.back{color:var(--muted);text-decoration:none;font-size:14px;display:inline-block;margin-bottom:14px}
.back:hover{color:var(--ink)}
.cpage{display:flex;flex-direction:column;gap:18px;max-width:860px;margin:0 auto}
.cbox{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px 28px;box-shadow:var(--shadow);position:relative}
.cbox > h2{font-family:var(--display);font-size:18px;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.cbox > h2::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cc,var(--gold))}
.cbox > h2 .edit{margin-left:auto}
.edit{font-family:var(--body);font-size:12px;font-weight:500;border:1px solid var(--line);background:var(--paper2);color:var(--muted);border-radius:999px;padding:2px 12px;cursor:pointer}
.edit:hover{color:var(--ink);border-color:var(--gold)}
.hero{display:grid;grid-template-columns:180px minmax(0,1fr);gap:28px;align-items:start}
.avbox{position:relative}
.avbox img{width:180px;height:180px;border-radius:50%;object-fit:cover;border:5px solid var(--surface);box-shadow:0 0 0 3px var(--cc),var(--shadow);cursor:zoom-in;background:var(--paper2)}
.avbtn{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);white-space:nowrap;font-size:12px;border:1px solid var(--black);background:var(--black);color:#fffaf0;border-radius:999px;padding:3px 12px;cursor:pointer;box-shadow:var(--shadow)}
.hero h1{font-size:36px;line-height:1.2;word-break:break-word}
.hero .al{font-family:var(--latin);font-style:italic;font-size:19px;color:var(--muted);margin-top:2px}
.hero .pills{margin:10px 0 14px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 18px;margin:0}
.facts div{border-bottom:1px dotted var(--line);padding:4px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-weight:500;font-variant-numeric:tabular-nums;word-break:break-word}
.swatches{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.sw{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.sw i{width:20px;height:20px;border-radius:50%;border:1px solid rgba(0,0,0,.12);display:inline-block}
.hero .tagrow{margin-top:12px}
@media (max-width:640px){.cbox{padding:20px 18px;border-radius:18px}.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.hero .pills,.swatches{justify-content:center}.facts{text-align:left;width:100%}}
.prose{max-width:68ch;white-space:pre-wrap}
.sec{margin-bottom:18px}
.sec:last-child{margin-bottom:0}
.sec h3{font-size:14px;color:var(--muted);font-family:var(--body);font-weight:500;letter-spacing:.08em;margin-bottom:4px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.gitem{margin:0;background:var(--paper2);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.gitem img{width:100%;aspect-ratio:1/1;object-fit:cover;cursor:zoom-in;background:var(--bg)}
.gitem .cap{padding:8px 10px;display:grid;gap:1px;font-size:12.5px}
.gitem .cap b{font-family:var(--display);font-size:14px}
.kv{display:grid;grid-template-columns:3em 1fr;gap:6px}
.kv span:first-child{color:var(--muted)}
details.more{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
details.more > summary{cursor:pointer;list-style:none;padding:16px 28px;font-family:var(--display);font-weight:700;font-size:16px;display:flex;align-items:center;gap:10px}
details.more > summary::-webkit-details-marker{display:none}
details.more > summary::after{content:"展開";margin-left:auto;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted)}
details.more[open] > summary::after{content:"收起"}
details.more .inner{padding:0 28px 24px;display:flex;flex-direction:column;gap:22px}
details.more .inner h3{font-family:var(--display);font-size:16px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
details.more .inner h3 .edit{margin-left:auto}
.storylist{display:flex;flex-direction:column;gap:10px}
.story{border-left:3px solid var(--gold);padding:4px 0 4px 14px}
.story .d{font-size:12px;color:var(--accent)}
.story h4{margin:0 0 2px;font-family:var(--display);font-size:16px}
.story.private{border-left-style:dashed;opacity:.85}
.privtag,.storytag{display:inline-block;margin-left:8px;font-size:11px;padding:0 7px;border-radius:999px;vertical-align:1px}
.privtag{background:var(--black);color:#fffaf0}
.storytag{border:1px solid var(--accent);color:var(--accent)}
.fieldlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px 18px;margin:0}
.fieldlist div{border-bottom:1px dotted var(--line);padding:4px 0}
.fieldlist dt{font-size:12px;color:var(--muted)}
.fieldlist dd{margin:0}

/* [樣式] 關係 */
.rel-list{display:flex;flex-direction:column;gap:8px}
.rel-card{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:start;background:var(--paper2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.rel-card img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--surface)}
.rel-card.ext{border-style:dashed;background:transparent}
.rel-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.rel-line a{color:var(--ink)}
.rel-label{font-weight:700;color:var(--accent)}
.owner{font-size:12px;color:var(--muted)}
.rel-note{font-size:14px;color:var(--muted);margin-top:4px;white-space:pre-wrap}
.panel{background:var(--paper2);border:1px solid var(--line);border-radius:16px;padding:16px}
.graph-wrap{overflow-x:auto}
svg.graph{display:block;margin:0 auto;max-width:100%;height:auto}
svg .edge{stroke:var(--muted);stroke-width:1.5;fill:none;opacity:.75}
svg .edge.dashed{stroke-dasharray:5 4}
svg .elabel{pointer-events:none}
svg .elabel rect{fill:var(--surface);stroke:var(--line)}
svg .elabel text{fill:var(--ink);font-size:12px;font-family:var(--body)}
svg .node{cursor:pointer}
svg .node circle.ring{stroke-width:3;fill:var(--surface)}
svg .node.ext circle.ring{stroke-dasharray:4 3}
svg .nname text{fill:var(--ink);font-size:14px;font-weight:700;font-family:var(--body);paint-order:stroke;stroke:var(--paper2);stroke-width:5px;stroke-linejoin:round}
svg .nname .owner-t{fill:var(--muted);font-size:11.5px;font-weight:400}
svg.graph.focus .edge,svg.graph.focus .elabel,svg.graph.focus .node,svg.graph.focus .nname{opacity:.15}
svg.graph.focus .hl{opacity:1!important}
svg .arrow{fill:var(--muted)}
table.rt{width:100%;border-collapse:collapse;font-size:14px}
table.rt th,table.rt td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.rt th{font-size:12px;color:var(--muted);font-weight:500}
table.rt td:nth-child(1),table.rt td:nth-child(3){white-space:nowrap}
table.rt a{color:var(--ink)}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px}
.stack{display:grid;gap:16px;margin-top:16px}
.fold{padding:0}
.fold > *:not(.foldbtn){margin:0 16px 16px}
.foldbtn{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:12px 16px;cursor:pointer;font-family:var(--display);font-weight:700;font-size:16px;text-align:left;color:var(--ink)}
.chev{width:14px;color:var(--muted)}
.foldhint{margin-left:auto;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted)}
.pickbar{margin-top:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.flabel2{font-size:13px;color:var(--muted)}
.arrow-sep{color:var(--muted);font-size:20px;line-height:1}
.selx{min-width:150px;padding:7px 12px;font-size:15px;cursor:pointer;border-radius:999px}

/* [樣式] 年表 */
.tl{position:relative;margin-left:8px;padding-left:28px;border-left:2px dotted var(--gold);display:flex;flex-direction:column;gap:14px}
.year-mark{font-family:var(--latin);font-weight:600;font-size:28px;margin-left:-28px;padding-left:2px;position:relative;background:var(--surface);letter-spacing:.04em;line-height:1.3}
.ev{position:relative;background:var(--paper2);border:1px solid var(--line);border-radius:14px;padding:10px 16px;max-width:760px}
.ev::before{content:"";position:absolute;left:-37px;top:50%;margin-top:-7px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--cc,var(--gold))}
.ev.era{display:grid;grid-template-columns:52px 44px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;cursor:pointer;width:100%;font:inherit;color:inherit}
.ev.era:hover{border-color:var(--gold);background:var(--surface)}
.era-m{font-family:var(--latin);font-size:18px;font-weight:600;color:var(--accent)}
.ev.era img{width:44px;height:44px;border-radius:50%;object-fit:cover}
.era-n{display:flex;flex-direction:column;min-width:0}
.era-n b{font-family:var(--display);font-size:16px}
.era-n small{font-family:var(--latin);font-style:italic;color:var(--muted);font-size:14px}
.era-c{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.ev.era{grid-template-columns:44px 40px minmax(0,1fr)}.era-c{grid-column:2/-1;justify-content:flex-start}}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:1px 10px 1px 2px;background:var(--surface);cursor:pointer}
.chip img{width:22px;height:22px;border-radius:50%;object-fit:cover}

/* [樣式] 站長的話 */
.notes-grid{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:36px;align-items:start}
.notes-grid.solo{grid-template-columns:minmax(0,1fr)}
.notes-text{max-width:66ch}
.notes-body{font-size:16px;line-height:1.95}
.nframe{text-align:center}
.nframe img{width:200px;height:200px;border-radius:50%;object-fit:cover;margin:0 auto;border:5px solid var(--surface);box-shadow:0 0 0 3px var(--gold),var(--shadow);cursor:zoom-in;background:var(--paper2)}
.ncap{font-family:var(--display);font-size:14px;margin-top:12px}
@media (max-width:760px){.notes-grid{grid-template-columns:1fr}.nframe{order:-1}}

/* [樣式] 對話框 */
.modal-bg{position:fixed;inset:0;background:rgba(74,52,35,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:30px 16px}
.modal{background:var(--surface);border-radius:22px;width:100%;max-width:820px;padding:24px 26px;box-shadow:0 14px 44px rgba(74,52,35,.3)}
.modal.small{max-width:460px}
.modal.wide2{max-width:640px}
.modal h2{font-size:22px;margin-bottom:14px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;position:sticky;bottom:-24px;background:var(--surface);padding:12px 0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--paper2);border-radius:10px;padding:7px 10px;width:100%}
.field input[type=color]{padding:2px;height:36px}
.field .check input{width:auto}
.field textarea{min-height:110px;resize:vertical;line-height:1.6}
.field.wide{grid-column:1/-1}
fieldset{border:1px solid var(--line);border-radius:16px;padding:12px 14px 14px;margin:16px 0 0}
legend{font-family:var(--display);font-weight:700;padding:0 6px}
.imgrow{display:grid;grid-template-columns:84px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.imgrow:first-of-type{border-top:0}
.imgrow .th{width:84px;height:84px;border-radius:12px;background:var(--paper2);object-fit:cover;border:1px solid var(--line)}
.imgrow .fl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.imghint{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.palrow{display:grid;grid-template-columns:1fr 60px auto;gap:8px;align-items:center;padding:6px 0}

var IMG_MAX = 1500, IMG_Q = 0.88;
var IMG_HINT = '<span class="imghint">長邊最多 '+IMG_MAX+' 像素・JPG 格式（上傳時會自動調整）<br>・JPG 不支援透明背景，去背 PNG 的透明處會變成白色<br>・會動的 GIF 只會留下第一格畫面</span>';
function toJpeg(file){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onload = function(){
      var im = new Image();
      im.onload = function(){
        var w = im.naturalWidth || im.width, h = im.naturalHeight || im.height, k = Math.min(1, IMG_MAX/Math.max(w,h));
        var cv = document.createElement("canvas"); cv.width = Math.max(1, Math.round(w*k)); cv.height = Math.max(1, Math.round(h*k));
        var ctx = cv.getContext("2d"); ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,cv.width,cv.height);
        ctx.imageSmoothingQuality = "high"; ctx.drawImage(im,0,0,cv.width,cv.height);
        res(cv);
      };
      im.onerror = rej; im.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
function readImage(file){
  if(GH) return toJpeg(file).then(function(cv){
    var dataUrl = cv.toDataURL("image/jpeg", IMG_Q), path = "images/" + Date.now().toString(36) + Math.random().toString(36).slice(2,6) + ".jpg";
    setStatus("上傳圖片中…", false);
    return ghApi("/contents/"+path, {method:"PUT", body:{message:"上傳圖片", content:dataUrl.split(",")[1], branch:GH.branch}}).then(function(){
      imgCache[path] = dataUrl; setStatus("圖片已上傳", false); return path;
    });
  });
  return toJpeg(file).then(function(cv){
    if(assets){
      return new Promise(function(res){ cv.toBlob(res, "image/jpeg", IMG_Q); }).then(function(blob){
        if(!blob) throw 0;
        return assets.upload(blob).then(function(r){ return "/_blob/" + r.id; });
      }).catch(function(){ return cv.toDataURL("image/jpeg", IMG_Q); });
    }
    return cv.toDataURL("image/jpeg", IMG_Q);
  });
}

function graphSVG(ego){
  var nodes = [], ids = {}, edges = [];
  function addNode(n){ if(!ids[n.id]){ ids[n.id] = n; nodes.push(n); } }
  function charNode(c){ return {id:c.id, name:c.name, img:cover(c), color:color(c.color), ext:false}; }
  if(ego){
    var me = byId(ego); addNode(charNode(me));
    relsOf(ego).forEach(function(r){ var o = relOther(r, ego); if(!o) return; addNode(o); edges.push({r:r, from: r.a===ego ? ego : o.id, to: r.a===ego ? o.id : ego}); });
  } else {
    var RID2 = relatedIds();
    state.chars.filter(function(c){ if(!RID2[c.id]) return false; var rc = ui.relCat||"全部"; if(rc!=="全部" && c.cat!==rc) return false; if(ui.relProj && hasSub(rc) && (c.project||"__none")!==ui.relProj) return false; return true; }).forEach(function(c){ addNode(charNode(c)); });
    state.relations.forEach(function(r){
      if(!ids[r.a] || ids[r.a].ext) return;
      if(r.ext){ var o = relOther(r, r.a); addNode(o); edges.push({r:r, from:r.a, to:o.id}); }
      else if(ids[r.b] && r.a!==r.b) edges.push({r:r, from:r.a, to:r.b});

  var pos = {}, n = nodes.length, W, H, cx, cy, R;
  if(ego){
    var k = n-1; R = k<=1 ? 190 : Math.max(220, k*42); W = R*2+240; H = R*2+190; cx = W/2; cy = H/2;
    pos[nodes[0].id] = {x:cx, y:cy};
    nodes.slice(1).forEach(function(nd,i){ var a = -Math.PI/2 + i*2*Math.PI/Math.max(k,1); pos[nd.id] = {x:cx+R*Math.cos(a), y:cy+R*Math.sin(a)}; });
  } else {
    R = n<=2 ? 150 : Math.max(200, n*42); W = R*2+240; H = R*2+190; cx = W/2; cy = H/2;
    if(n===1){ R = 60; W = 360; H = 200; cx = W/2; cy = 90; }
    nodes.forEach(function(nd,i){ var a = -Math.PI/2 + i*2*Math.PI/n; pos[nd.id] = n===1 ? {x:cx, y:cy} : {x:cx+R*Math.cos(a), y:cy+R*Math.sin(a)}; });
  }
  var foc = !ego && ui.focus && ids[ui.focus] ? ui.focus : null;
  var out = '<svg class="graph'+(foc?" focus":"")+'" viewBox="0 0 '+W+' '+H+'" width="'+W+'" role="img" aria-label="角色關係圖"><defs><marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0,0 L10,5 L0,10 z"/></marker>';
  nodes.forEach(function(nd,i){ out += '<clipPath id="cp'+i+'"><circle cx="'+pos[nd.id].x+'" cy="'+pos[nd.id].y+'" r="27"/></clipPath>'; });
  out += '</defs>';
  var labels = "";
  edges.forEach(function(e){
    var r = e.r, p = pos[e.from], q = pos[e.to], dx = q.x-p.x, dy = q.y-p.y, Ln = Math.sqrt(dx*dx+dy*dy)||1, ux = dx/Ln, uy = dy/Ln;
    var rev = edges.some(function(o){ return o!==e && o.from===e.to && o.to===e.from; });
    var sx = p.x+ux*36, sy = p.y+uy*36, ex = q.x-ux*38, ey = q.y-uy*38;
    var off = rev ? 28 : 0, mx = (sx+ex)/2 - uy*off, my = (sy+ey)/2 + ux*off;
    var hl = foc && (e.from===foc||e.to===foc) ? " hl" : "";
    out += '<path class="edge'+hl+(r.ext?" dashed":"")+'" d="M'+sx+','+sy+' Q'+(2*mx-(sx+ex)/2)+','+(2*my-(sy+ey)/2)+' '+ex+','+ey+'" '+(r.mutual?'marker-start="url(#arr)" ':'')+'marker-end="url(#arr)"/>';
    var lw = Math.max(40, String(r.label||"").length*13+16);
    labels += '<g class="elabel'+hl+'"><rect x="'+(mx-lw/2)+'" y="'+(my-11)+'" width="'+lw+'" height="22" rx="11"/><text x="'+mx+'" y="'+(my+4)+'" text-anchor="middle">'+esc(r.label||"")+'</text></g>';
  });
  var names = "";
  nodes.forEach(function(nd,i){
    var p = pos[nd.id], hl = foc && (foc===nd.id || edges.some(function(e){ return (e.from===foc&&e.to===nd.id)||(e.to===foc&&e.from===nd.id); })) ? " hl" : "";
    var big = ego && i===0, isCenter = ego && i===0;
    out += '<g class="node'+hl+(nd.ext?" ext":"")+'" '+(nd.ext?'':'data-node="'+esc(nd.id)+'" tabindex="0"')+'><circle class="ring" cx="'+p.x+'" cy="'+p.y+'" r="'+(big?32:30)+'" stroke="'+nd.color+'"/>'+
      '<image href="'+nd.img+'" x="'+(p.x-27)+'" y="'+(p.y-27)+'" width="54" height="54" preserveAspectRatio="xMidYMin slice" clip-path="url(#cp'+i+')"/></g>';
    var up = !isCenter && (p.y - cy) < -20;
    var owner = nd.ext ? (nd.owner || "") : "";
    var y1 = up ? p.y - (owner ? 60 : 44) : p.y + 52, y2 = y1 + 16;
    names += '<g class="nname'+hl+'"><text x="'+p.x+'" y="'+y1+'" text-anchor="middle">'+esc(nd.name)+'</text>'+
      (owner?'<text class="owner-t" x="'+p.x+'" y="'+y2+'" text-anchor="middle">'+esc(owner)+'</text>':'')+'</g>';
  });

}

/* 匯出公開網站 */
function blobToDataURL(b){ return new Promise(function(res, rej){ var fr = new FileReader(); fr.onload = function(){ res(fr.result); }; fr.onerror = rej; fr.readAsDataURL(b); }); }
function exportSite(btn, msg){
  function say(x){ if(msg) msg.textContent = x; }
  btn.disabled = true; say("準備中…");
  var ex = JSON.parse(JSON.stringify(state));
  ex.chars.forEach(function(c){ c.stories = (c.stories||[]).filter(function(x){ return x.public!==false; }); delete c.example; });
  ex.settings.exportMode = true;
  var srcs = [], add = function(x){ if(x && /^\/_blob\//.test(x) && srcs.indexOf(x)<0) srcs.push(x); };
  ex.chars.forEach(function(c){ ["mainImages","outfits","gallery"].forEach(function(k){ (c[k]||[]).forEach(function(it){ add(it.src); }); }); });
  ex.relations.forEach(function(r){ if(r.ext) add(r.ext.img); });
  add(ex.settings.notesImg);
  var map = {}, failed = 0, done = 0;
  Promise.all(srcs.map(function(src){
    return fetch(src).then(function(r){ if(!r.ok) throw 0; return r.blob(); }).then(blobToDataURL).then(function(u){ map[src] = u; })
      .catch(function(){ failed++; }).then(function(){ done++; say("打包圖片 "+done+" / "+srcs.length); });
  })).then(function(){
    var json = JSON.stringify(ex);
    Object.keys(map).forEach(function(src){ json = json.split(JSON.stringify(src)).join(JSON.stringify(map[src])); });
    var doc = buildDoc(json);
    var mb = (doc.length/1048576).toFixed(1);
    return Promise.resolve(use ? use("downloads") : null).then(function(dl){
      if(!dl){ say("這裡無法下載檔案，請在 claude.ai 上打開網站再試一次。"); return; }
      return dl.save({filename:"index.html", data:new Blob([doc], {type:"text/html"})}).then(function(){
        say("已匯出（約 "+mb+" MB）"+(failed?"，有 "+failed+" 張圖片讀不到，公開版裡會顯示預設剪影":"")+"。");
      }).catch(function(e){ var c = e && e.code; say(c==="declined" ? "已取消下載。" : "匯出失敗，請再試一次。"); });
    });
  }).catch(function(){ say("匯出失敗，請再試一次。"); }).then(function(){ btn.disabled = false; });
}

      cd.forEach(function(x){ x.name = x.name.trim(); x.sub = (x.sub||"").trim(); });
      var keep = {}; cd.forEach(function(x){ keep[x.id] = 1; });
      state.chars.forEach(function(c){ if(c.cat && !keep[c.cat]) c.cat = ""; });
      state.settings.cats = cd; if(!keep[ui.cat]) ui.cat = "全部"; if(!keep[ui.relCat]){ ui.relCat = "全部"; ui.relProj = ""; }
      m.remove(); save(); render(); toast("分類已儲存");
    }
  });
}

/* 設定與備份 */
function settings(){
  var lb = state.settings.labels;
  var labelsHTML = LABEL_DEFS.map(function(g){ return '<fieldset><legend>'+esc(g[0])+'</legend><div class="fgrid">'+g[1].map(function(p){
      return '<div class="field"><label for="lb-'+p[0]+'">預設：'+esc(p[1])+'</label><input id="lb-'+p[0]+'" data-label="'+p[0]+'" placeholder="'+esc(p[1])+'" value="'+esc(lb[p[0]]||"")+'"></div>'; }).join("")+'</div></fieldset>'; }).join("");
  var m = modal('<h2>設定與備份</h2>'+
    '<div class="field" style="margin-top:12px"><label>字體風格</label><div class="fontpick">'+[["serif","明朝檔案","端正的明體，像印刷的檔案"],["kai","文楷手札","帶點手寫感的楷體"],["sans","俐落黑體","乾淨現代的黑體"]].map(function(f){
      return '<label class="fopt font-'+f[0]+'"><input type="radio" name="s-font" value="'+f[0]+'" '+((state.settings.font||"serif")===f[0]?"checked":"")+'><b>'+f[1]+'</b><span>'+f[2]+'</span><em>白鷺澪的檔案 2023</em></label>'; }).join("")+'</div></div>'+
    '<label class="check" style="margin:14px 0 4px"><input type="checkbox" id="s-prot" '+(state.settings.protectImages!==false?"checked":"")+'>訪客瀏覽時保護圖片（停用右鍵、拖曳和長按另存）</label>'+
    '<p class="muted" style="font-size:13px">備份會把所有角色、關係和時間軸複製成一段文字，可以貼到記事本保存。用「匯入」貼回去就能還原。</p>'+
    (GH?'':'<div class="exportbox needs-write"><b>匯出公開網站</b><p class="hint">產生一份可以直接放上 GitHub Pages 的 index.html。圖片會一起打包進去，編輯功能和不公開的故事都會移除。</p><button class="btn primary" data-export>匯出公開網站</button><span class="hint" id="exp-msg"></span></div>')+
    '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-copy>複製備份文字</button><button class="btn needs-write" data-imp>匯入備份</button>'+
    '<button class="btn danger needs-write" data-clr>刪除所有範例角色</button><button class="btn needs-write" data-mcats>管理分類</button></div>'+
    '<h2 style="margin-top:26px;font-size:20px">標題文字</h2><p class="hint">把網站上的標題換成你想要的文字。留空就使用預設文字。</p>'+labelsHTML+
    '<div style="margin-top:10px"><button class="btn sm" data-lbreset>全部恢復預設</button></div>'+
    '<div class="field" id="imp-box" style="display:none;margin-top:12px"><label for="s-imp">貼上備份文字</label><textarea id="s-imp"></textarea><button class="btn primary sm" data-doimp style="margin-top:6px;align-self:flex-start">確定匯入（會取代現有資料）</button></div>'+
    '<div class="mfoot"><button class="btn" data-x>關閉</button><button class="btn primary needs-write" data-s>儲存設定</button></div>');
  m.addEventListener("click", function(e){
    var t = e.target.closest("button"); if(!t) return;
    if(t.hasAttribute("data-x")) m.remove();
    else if(t.hasAttribute("data-s")){ state.settings.protectImages = m.querySelector("#s-prot").checked;
      var fr = m.querySelector('input[name="s-font"]:checked'); if(fr) state.settings.font = fr.value;
      var nl = {}; [].forEach.call(m.querySelectorAll("[data-label]"), function(x){ var v = x.value.trim(); if(v && v!==LABEL_DEFAULT[x.dataset.label]) nl[x.dataset.label] = v; }); state.settings.labels = nl; m.remove(); save(); applyMode(); }
    else if(t.hasAttribute("data-mcats")){ m.remove(); manageCats(); }
    else if(t.hasAttribute("data-lbreset")){ [].forEach.call(m.querySelectorAll("[data-label]"), function(x){ x.value = ""; }); toast("已清空，按「儲存設定」後生效"); }
    else if(t.hasAttribute("data-export")){ exportSite(t, m.querySelector("#exp-msg")); }
    else if(t.hasAttribute("data-copy")){
      var txt = JSON.stringify(state);
      navigator.clipboard.writeText(txt).then(function(){ toast("已複製備份文字"); }).catch(function(){ m.querySelector("#imp-box").style.display="flex"; m.querySelector("#s-imp").value = txt; m.querySelector("#s-imp").select(); toast("無法自動複製，請手動複製下方文字"); });
    }
    else if(t.hasAttribute("data-imp")){ m.querySelector("#imp-box").style.display = "flex"; m.querySelector("#s-imp").value = ""; m.querySelector("#s-imp").focus(); }
    else if(t.hasAttribute("data-doimp")){
      try{ var s = JSON.parse(m.querySelector("#s-imp").value); if(!s || !Array.isArray(s.chars)) throw 0; state = s; state.relations = s.relations||[]; state.timeline = s.timeline||[]; state.settings = s.settings||{siteTitle:"原創角色檔案館"}; m.remove(); save(); go(""); toast("已匯入"); }
      catch(err){ toast("這段文字不是有效的備份，請確認有完整貼上"); }
    }
    else if(t.hasAttribute("data-clr")){
      confirmBox("要刪除所有標示「範例」的角色，以及他們的關係和事件嗎？", function(){
        var gone = {}; state.chars.forEach(function(c){ if(c.example) gone[c.id]=1; });
        state.chars = state.chars.filter(function(c){ return !gone[c.id]; });
        state.relations = state.relations.filter(function(r){ return !gone[r.a] && !gone[r.b]; });
        state.timeline = state.timeline.filter(function(e){ e.chars = (e.chars||[]).filter(function(id){return !gone[id];}); return e.chars.length || ["t1","t2","t3"].indexOf(e.id)<0; });
        m.remove(); save(); go(""); toast("範例已刪除");
      });
    }
  });
}

/* ---------- 事件委派 ---------- */
var TOUCH = window.matchMedia && matchMedia("(hover: none)").matches;
root.addEventListener("click", function(e){
  var t = e.target;
  var pc = t.closest && t.closest(".pcard");
  if(pc && !pc.classList.contains("active")){
    e.preventDefault();
    root.querySelectorAll(".pcard.active,.pcard.mate").forEach(function(x){ x.classList.remove("active"); x.classList.remove("mate"); });
    var r0 = pc.getBoundingClientRect(); pc.classList.toggle("flip", r0.right + 190 > (document.documentElement.clientWidth||innerWidth));
    pc.classList.add("active"); root.classList.add("pc-focus");
    var mk = pc.getAttribute("data-k"); if(mk) root.querySelectorAll(".pcard").forEach(function(x){ if(x!==pc && x.getAttribute("data-k")===mk) x.classList.add("mate"); });
    return;
  }
  if(!pc){ var act = root.querySelector(".pcard.active"); if(act && !t.closest(".fmenu")){ act.classList.remove("active"); root.querySelectorAll(".pcard.mate").forEach(function(x){ x.classList.remove("mate"); }); root.classList.remove("pc-focus"); } }
  var g = t.closest("[data-go]"); if(g){ go(g.getAttribute("data-go")); return; }
  var b = t.closest("button,[data-node],[data-zoom]"); if(!b) return;
  var ds = b.dataset;
  if(ds.cat){ ui.cat = ds.cat; keepUI(); render(); }
  else if(ds.gender){ ui.gender = ds.gender; keepUI(); render(); }
  else if(ds.sort){ ui.sort = ds.sort; keepUI(); render(); }
  else if(ds.tab){ ui.tab = ds.tab; keepUI(); render(); }
  else if(ds.relcat){ ui.relCat = ds.relcat; ui.focus = null; render(); }
  else if(ds.node){ if(ui.relEgo){ ui.relEgo = ds.node; var nc = byId(ds.node); if(nc){ ui.relCat = nc.cat; ui.relProj = projNames(nc)[0] || "__none"; } } else { ui.focus = ui.focus===ds.node ? null : ds.node; } keepUI(); render(); }
  else if(b.hasAttribute("data-relreset")){ ui.relCat = "全部"; ui.relProj = ""; ui.relEgo = ""; ui.focus = null; keepUI(); render(); }
  else if(ds.relego!==undefined){ ui.relEgo = (ui.relEgo===ds.relego) ? "" : ds.relego; ui.relCat = "全部"; ui.relProj = ""; ui.focus = null; keepUI(); render(); }
  else if(ds.relgo){ ui.relEgo = ds.relgo; var gc = byId(ds.relgo); if(gc){ ui.relCat = gc.cat; ui.relProj = projNames(gc)[0] || "__none"; } keepUI(); go("relations"); }
  else if(ds.tlyear){ ui.tlOpen = ui.tlOpen || {}; var yb = b.getAttribute("aria-expanded"); var curOpen = root.querySelector('.yh[data-tlyear="'+ds.tlyear+'"]').getAttribute("aria-expanded")==="true"; ui.tlOpen[ds.tlyear] = !curOpen; keepUI(); render(); }
  else if(ds.tlcat){ ui.tlCat = ds.tlcat; keepUI(); render(); }
  else if(ds.fold){ ui[ds.fold] = ui[ds.fold]===false; keepUI(); render(); }
  else if(ds.redit){ editRel(ds.redit); }
  else if(ds.zoom==="notes"){ lightbox({name:"", notes:[{src:state.settings.notesImg, note:state.settings.notesCaption}]}, "notes", 0); }
  else if(ds.zoom){ var c = byId(route().id); if(c) lightbox(c, ds.zoom, +ds.i); }
  else if(ds.rdel){ state.relations = state.relations.filter(function(r){return r.id!==ds.rdel;}); save(); render(); }
  else if(ds.ev!==undefined){ editEvent(ds.ev, (ds.pre||"").split(",").filter(Boolean)); }
  else if(ds.tlmode){
    if(ds.tlmode==="all"){ ui.tlMode = "all"; }
    else { ui.tlMode = "pick"; ui.tlMulti = ds.tlmode==="multi"; var p = tlPicked(); if(!ui.tlMulti) ui.tlChars = p.slice(0,1); }
    keepUI(); render();
  }
  else if(ds.tlc){
    var cur = tlPicked();
    if(ui.tlMode==="all"){ ui.tlMode = "pick"; ui.tlChars = [ds.tlc]; }
    else if(ui.tlMulti){ var k = cur.indexOf(ds.tlc); if(k>=0){ if(cur.length>1) cur.splice(k,1); } else cur.push(ds.tlc); ui.tlChars = cur; }
    else ui.tlChars = [ds.tlc];
    keepUI(); render();
  }
  else if(ds.tlone){ ui.tlMode = "pick"; ui.tlMulti = false; ui.tlChars = [ds.tlone]; keepUI(); go("timeline"); }
  else if(ds.evdel){ confirmBox("要刪除這個事件嗎？", function(){ state.timeline = state.timeline.filter(function(x){return x.id!==ds.evdel;}); save(); render(); }); }
  else if(ds.act==="group"){ ui.group = !ui.group; keepUI(); render(); }
  else if(ds.act==="new"){ editChar(null); }
  else if(ds.act==="edit"){ editChar(ds.id, ds.sec || null); }
  else if(ds.act==="settings"){ settings(); }
  else if(ds.act==="cats"){ manageCats(); }
  else if(ds.act==="vis"){ var vc = byId(ds.id); if(vc){ if(vc.hidden) delete vc.hidden; else vc.hidden = true; vc.updatedAt = new Date().toISOString(); save(); render(); toast(vc.hidden ? "已設為不公開，訪客看不到這位角色" : "已公開"); } }
  else if(ds.act==="menu"){ var fm = root.querySelector(".fmenu"), open = !fm.classList.contains("open"); fm.classList.toggle("open", open); b.setAttribute("aria-expanded", open); b.setAttribute("aria-label", open?"關閉選單":"開啟選單"); }
  else if(ds.act==="avatar"){ changeAvatar(ds.id); }
  else if(ds.act==="ghlogin"){ loginBox(); }
  else if(ds.act==="ghlogout"){ ghLogout(); }
  else if(ds.act==="notes"){ editNotes(); }
  else if(ds.act==="guest"){ ui.guest = !ui.guest; keepUI(); applyMode(); toast(ui.guest?"已切換為訪客模式":"已回到編輯模式"); }
  else if(ds.act==="del"){ var cc = byId(ds.id); confirmBox("要刪除「"+cc.name+"」嗎？他的關係也會一起刪除。", function(){
      state.chars = state.chars.filter(function(x){return x.id!==ds.id;});
      state.relations = state.relations.filter(function(r){return r.a!==ds.id && r.b!==ds.id;});
      state.timeline.forEach(function(ev){ ev.chars = (ev.chars||[]).filter(function(i){return i!==ds.id;}); });
      save(); go(""); });
  }
  else if(ds.act==="newrel"){ editRel(null, ds.id || ui.relEgo || ""); }
});
root.addEventListener("input", function(e){
  if(e.target.id==="q"){ ui.q = e.target.value; keepUI(); var pos = e.target.selectionStart; render(); var q = root.querySelector("#q"); q.focus(); try{q.setSelectionRange(pos,pos);}catch(x){} }
});
root.addEventListener("toggle", function(e){ if(e.target.matches && e.target.matches("details.more")){ ui.moreOpen = e.target.open; keepUI(); } }, true);

  var t = e.target;
  if(t.id==="relego"){ ui.relEgo = t.value; ui.focus = null; if(t.value){ var ec = byId(t.value); ui.relCat = ec.cat; ui.relProj = projNames(ec)[0] || "__none"; } keepUI(); render(); }

  else if(t.id==="showc"){ ui.showCreated = t.checked; keepUI(); render(); }
});

/* ---------- 圖片保護 ---------- */
function isProtected(t){ return document.body.classList.contains("protect") && t && t.closest && t.closest("img,image,.portrait,.gitem,.lightbox,.card .pic"); }
document.addEventListener("contextmenu", function(e){ if(isProtected(e.target)){ e.preventDefault(); toast("圖片受作者保護，請勿下載或轉載"); } });
document.addEventListener("dragstart", function(e){ if(isProtected(e.target)) e.preventDefault(); });

/* ---------- 啟動 ---------- */
try{ var lh = sessionStorage.getItem("oc-hash"); if(lh && !location.hash){ sessionStorage.removeItem("oc-hash"); history.replaceState(null,"",lh); } }catch(e){}
document.body.classList.add("ro","protect","font-"+(state.settings.font||"serif"));
render();
var use = (!GH && !state.settings.exportMode && window.claude && typeof window.claude.use === "function") ? window.claude.use.bind(window.claude) : null;
function none(){ return null; }
if(GH){
  use = null;
  var savedTk = null, savedLocal = false; if(GH.admin) try{ savedLocal = !!localStorage.getItem("oc-gh-token"); savedTk = localStorage.getItem("oc-gh-token") || sessionStorage.getItem("oc-gh-token"); }catch(e){}
  var loadPublic = function(){ return fetch("data.json?v="+Date.now(), {cache:"no-store"}).then(function(r){ if(!r.ok) throw 0; return r.json(); }); };
  (savedTk ? ghLogin(savedTk, savedLocal).then(ghLoad).then(function(d){ canEdit = true; return d; }).catch(function(){ try{ localStorage.removeItem("oc-gh-token"); }catch(e){} return loadPublic(); }) : loadPublic())
    .then(function(d){ state = d; normalize(); setStatus(canEdit ? "已登入，修改會存到 GitHub" : "", false); applyMode(); if(GH.admin && !canEdit) loginBox(); })
    .catch(function(){ root.innerHTML = '<div class="wrap" style="padding:60px 20px;color:#f1e6d0">資料載入失敗，請重新整理頁面。</div>'; });
} else if(use){
  Promise.all([use("artifact").catch(none), use("assets").catch(none), use("user").catch(none)]).then(function(r){
    art = r[0]; assets = r[1]; connected = !!art;
    var u = r[2];
    return (u ? Promise.resolve().then(function(){ return u.canEdit(); }).catch(none) : Promise.resolve(null)).then(function(ce){
      canEdit = !!art && (ce===true || ((ce===null || ce===undefined) && !!assets));
      setStatus(canEdit ? "修改會自動保存" : "", false);
      applyMode();
    });
  });
} else { setStatus(state.settings.exportMode ? "" : "預覽模式：修改不會保存", !state.settings.exportMode); }
})();
